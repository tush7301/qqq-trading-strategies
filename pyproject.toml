[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq"
version = "0.1.0"
description = "Development and back-testing of trading strategies on QQQ"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]          # WS4 may use torch OR sklearn MLPClassifier; decide in week 1
dev = ["pytest>=8", "jupyter", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
